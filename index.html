    </div>
  </header>

  <!-- Simple Single-Box Workspace -->

        <div class="flex items-center gap-2">
          <span id="directionBadge" class="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-200 text-slate-700">
            <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i>
            <span id="directionText">自動偵測：等待輸入</span>
          </span>
          <button id="toggleDirBtn" type="button" class="text-xs text-slate-500 hover:text-slate-800 underline underline-offset-2 cursor-pointer">
            切換方向
          </button>
        </div>
        <div class="flex items-center gap-1.5 text-xs">
          <span class="text-slate-400 hidden sm:inline">範例：</span>
          <button type="button" data-sample="cn1" class="sample-btn px-2 py-1 rounded-md bg-white border border-slate-200 hover:border-sky-400 hover:text-sky-700 text-slate-600 transition cursor-pointer">
            中文範例
          </button>
          <button type="button" data-sample="en1" class="sample-btn px-2 py-1 rounded-md bg-white border border-slate-200 hover:border-emerald-400 hover:text-emerald-700 text-slate-600 transition cursor-pointer">
            英文範例
          </button>
        </div>
      </div>

      <!-- Input Box -->
      <div class="p-4 space-y-3">
        <label for="notamInput" class="sr-only">輸入飛航公告內容</label>
        <textarea
          id="notamInput"

          spellcheck="false"

        ></textarea>

        <!-- Dynamic English Quick-Pick Bar -->
        <div id="autocompleteBar" class="hidden rounded-xl bg-sky-50/90 border border-sky-200 p-2.5">
          <div class="flex items-center justify-between gap-2 mb-2">
            <span class="text-xs font-semibold text-sky-900 flex items-center gap-1.5">
              <i data-lucide="zap" class="w-3.5 h-3.5 text-sky-600"></i>
              <span>快選單字（點擊插入，或按 <kbd class="px-1.5 py-0.5 bg-white border border-sky-300 rounded text-[10px]">Tab</kbd> 選第一項）</span>
            </span>
            <span id="typingTokenLabel" class="text-xs font-mono-code text-sky-700 font-semibold"></span>
          </div>
          <div id="autocompleteList" class="flex flex-wrap gap-1.5"></div>
        </div>

        <div id="idleHint" class="text-xs text-slate-400 flex items-center gap-1.5">
          <i data-lucide="keyboard" class="w-3.5 h-3.5"></i>
          <span>輸入英文單字時，下方會即時優先跳出相符的 ICAO / FAA 飛航公告縮寫供快速點選。</span>
        </div>

        <!-- Action Buttons -->
        <div class="pt-1 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <button id="clearBtn" type="button" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition cursor-pointer">

            <span class="text-xs text-slate-400 hidden sm:inline"><kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-200 rounded text-[11px]">Ctrl</kbd> + <kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-200 rounded text-[11px]">Enter</kbd></span>

          <button id="translateBtn" type="button" class="inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-xl text-sm sm:text-base font-semibold text-white bg-sky-600 hover:bg-sky-700 active:scale-[0.99] shadow-sm shadow-sky-600/20 transition cursor-pointer w-full sm:w-auto">

    </section>

    // =========================================================================
    // 3. Direction Detection & Prioritized English Quick-Pick
    // =========================================================================
    function detectDirection(text) {
      if (manualDirection) return manualDirection;
      if (!text.trim()) return null;
      return /[\u4e00-\u9fff]/.test(text) ? 'cn2en' : 'en2cn';
    }

    function updateDirectionBadge() {
      const dir = detectDirection(notamInput.value);
      const isManual = Boolean(manualDirection);
      const prefix = isManual ? '手動鎖定：' : '自動偵測：';
      if (!dir) {
        directionText.textContent = '自動偵測：等待輸入';
        directionBadge.className = 'inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-200 text-slate-700';
      } else if (dir === 'cn2en') {
        directionText.textContent = `${prefix}中文 → 英文飛航公告內容`;
        directionBadge.className = 'inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full bg-sky-100 text-sky-800';
      } else {
        directionText.textContent = `${prefix}英文 NOTAM → 繁體中文`;
        directionBadge.className = 'inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800';
      }
    }

    function getCurrentEnglishToken() {
      const pos = notamInput.selectionStart;
      const before = notamInput.value.slice(0, pos);
      const match = before.match(/([A-Za-z0-9/-]+)$/);
      return match ? { token: match[1], start: pos - match[1].length, end: pos } : null;
    }

    function updateAutocomplete() {
      const info = getCurrentEnglishToken();
      if (!info || info.token.length < 1) {
        autocompleteBar.classList.add('hidden');
        idleHint.classList.remove('hidden');
        currentSuggestions = [];
        return;
      }

      const q = info.token.toUpperCase();
      const prefixMatches = [];
      const containsMatches = [];

      for (const item of NOTAM_DICT) {
        const up = item.en.toUpperCase();
        if (up === q) continue;
        if (up.startsWith(q)) {
          prefixMatches.push(item);
        } else if (up.includes(q)) {
          containsMatches.push(item);
        }
      }

      const matches = [...prefixMatches, ...containsMatches].slice(0, 12);

      if (matches.length === 0) {
        autocompleteBar.classList.add('hidden');
        idleHint.classList.remove('hidden');
        currentSuggestions = [];
        return;
      }

      currentSuggestions = matches;
      typingTokenLabel.textContent = `相符字首：${info.token}`;
      autocompleteList.innerHTML = matches.map((item, idx) => `
        <button type="button" data-complete="${item.en}" class="ac-chip inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs border transition cursor-pointer ${
          idx === 0
            ? 'bg-sky-600 border-sky-700 text-white font-semibold shadow-sm'
            : 'bg-white border-sky-200 hover:border-sky-400 hover:bg-sky-50 text-slate-800'
        }">
          <span class="font-mono-code">${item.en}</span>
          <span class="text-[11px] ${idx === 0 ? 'text-sky-100' : 'text-slate-500'} font-normal">${item.zh}</span>
        </button>
      `).join('');

      autocompleteBar.classList.remove('hidden');
      idleHint.classList.add('hidden');
    }

    function insertCompletion(word) {
      const val = notamInput.value;
      const info = getCurrentEnglishToken();
      const start = info ? info.start : notamInput.selectionStart;
      const end = info ? info.end : notamInput.selectionEnd;

      const before = val.slice(0, start);
      const after = val.slice(end);
      const needTrailingSpace = after.length === 0 || !/^[\s\n,.]/.test(after);
      const inserted = word + (needTrailingSpace ? ' ' : '');

      notamInput.value = before + inserted + after;
      const newPos = before.length + inserted.length;
      notamInput.focus();
      notamInput.setSelectionRange(newPos, newPos);

      updateDirectionBadge();
      updateAutocomplete();
    }

    // =========================================================================
    // 4. Bidirectional Content Translation Engine (Full Coverage)
    // =========================================================================
    function translateCnToNotamContent(raw) {
      let text = raw.trim();
      const parts = [];

      let airportCode = null;
      const icaoMatch = text.match(/\b(RC[A-Z]{2})\b/i);
      if (icaoMatch) {
        airportCode = icaoMatch[1].toUpperCase();
      } else {
        for (const a of TAIWAN_AIRPORTS) {
          if (a.aliases.some(alias => text.includes(alias))) {
            airportCode = a.code;
            break;
          }
        }
      }

      const radMatch = text.match(/半徑\s*(\d+(?:\.\d+)?)\s*(?:浬|海浬|NM)/i);
      const rwyMatch = text.match(/(\d{2}[LRC]?(?:\/\d{2}[LRC]?)?)\s*跑道|跑道\s*(\d{2}[LRC]?(?:\/\d{2}[LRC]?)?)/i);
      const twyMatch = text.match(/([A-Z]\d?)\s*滑行道|滑行道\s*([A-Z]\d?)/i);

      if (/火砲|火炮|實彈射擊|射擊/.test(text)) {
        let p = 'GUN FRNG WILL TAKE PLACE';
        if (radMatch && airportCode) p += ` WI ${radMatch[1]}NM RAD OF ${airportCode}`;
        else if (airportCode) p += ` AT ${airportCode}`;
        parts.push(p);
      } else if (/無人機|遙控無人機|UAS|UAV/i.test(text)) {
        let p = 'UNMANNED ACFT (UAS) ACT WILL TAKE PLACE';
        if (radMatch && airportCode) p += ` WI ${radMatch[1]}NM RAD OF ${airportCode}`;
        else if (airportCode) p += ` AT ${airportCode}`;
        parts.push(p);
      } else if (/空中演習|演習/.test(text)) {
        let p = 'MIL AIR EXER WILL TAKE PLACE';
        if (radMatch && airportCode) p += ` WI ${radMatch[1]}NM RAD OF ${airportCode}`;
        else if (airportCode) p += ` AT ${airportCode}`;
        parts.push(p);
      } else if (/跳傘/.test(text)) {
        let p = 'PJE WILL TAKE PLACE';
        if (radMatch && airportCode) p += ` WI ${radMatch[1]}NM RAD OF ${airportCode}`;
        else if (airportCode) p += ` AT ${airportCode}`;
        parts.push(p);
      } else if (rwyMatch) {
        const rwyId = (rwyMatch[1] || rwyMatch[2]).toUpperCase();
        let p = `${airportCode ? airportCode + ' ' : ''}RWY ${rwyId}`;
        if (/關閉|封閉|停用/.test(text)) p += ' CLSD';
        else if (/恢復正常/.test(text)) p += ' RESUMED NML OPS';
        else if (/可用/.test(text)) p += ' AVBL';
        else if (/不可用/.test(text)) p += ' NOT AVBL';
        parts.push(p);
      } else if (twyMatch) {
        const twyId = (twyMatch[1] || twyMatch[2]).toUpperCase();
        let p = `${airportCode ? airportCode + ' ' : ''}TWY ${twyId}`;
        const btnMatch = text.match(/介於\s*([A-Z0-9/]+)\s*(?:與|和|至)\s*([A-Z0-9/]+)\s*之間/);
        if (btnMatch) p += ` BTN ${btnMatch[1].toUpperCase()} AND ${btnMatch[2].toUpperCase()}`;
        if (/關閉|封閉/.test(text)) p += ' CLSD';
        else if (/恢復正常/.test(text)) p += ' RESUMED NML OPS';
        parts.push(p);
      } else if (/停機坪/.test(text)) {
        parts.push(`${airportCode ? airportCode + ' ' : ''}APRON ${/關閉/.test(text) ? 'CLSD' : 'WIP'}`);
      } else if (/ILS|儀器降落/i.test(text)) {
        parts.push(`${airportCode ? airportCode + ' ' : ''}ILS ${/故障|無法使用|停用/.test(text) ? 'U/S' : 'ON TEST, DO NOT USE'}`);
      } else if (/PAPI|滑降燈/i.test(text)) {
        parts.push(`${airportCode ? airportCode + ' ' : ''}PAPI ${/故障|無法使用/.test(text) ? 'U/S' : 'MAINT'}`);
      } else if (/燈光|邊燈|進場燈/.test(text)) {
        const lgtName = /邊燈/.test(text) ? 'RWY EDGE LGT' : (/進場燈/.test(text) ? 'ALS' : 'AD LGT');
        parts.push(`${airportCode ? airportCode + ' ' : ''}${lgtName} ${/故障|無法使用/.test(text) ? 'U/S' : 'MAINT'}`);
      } else if (/VOR/i.test(text)) {
        parts.push(`${airportCode ? airportCode + ' ' : ''}VOR ${/故障|無法使用/.test(text) ? 'U/S' : 'MAINT'}`);
      } else if (/TACAN/i.test(text)) {
        parts.push(`${airportCode ? airportCode + ' ' : ''}TACAN ${/故障|無法使用/.test(text) ? 'U/S' : 'MAINT'}`);
      } else if (/DME/i.test(text)) {
        parts.push(`${airportCode ? airportCode + ' ' : ''}DME ${/故障|無法使用/.test(text) ? 'U/S' : 'MAINT'}`);
      } else if (/起重機|吊車|障礙物/.test(text)) {
        parts.push(`${airportCode ? airportCode + ' ' : ''}OBST CRANE ERECTED`);
      } else if (/飛測/.test(text)) {
        parts.push(`${airportCode ? airportCode + ' ' : ''}FLT CHECK WILL TAKE PLACE`);
      } else if (/鳥擊|鳥群/.test(text)) {
        parts.push(`${airportCode ? airportCode + ' ' : ''}CTN BIRD ACT`);
      } else if (/機場關閉/.test(text)) {
        parts.push(`${airportCode ? airportCode + ' ' : ''}AD CLSD`);
      } else {
        parts.push(`${airportCode ? airportCode + ' ' : ''}OPS NOTICE`);
      }

      if (/施工/.test(text)) parts.push('DUE TO WIP');
      else if (/維護|保養/.test(text)) parts.push('DUE TO MAINT');
      else if (/重鋪/.test(text)) parts.push('DUE TO RESURFACING');
      else if (/漆劃|畫線/.test(text)) parts.push('DUE TO PAINTING');
      else if (/割草/.test(text)) parts.push('DUE TO MOWING');
      else if (/測試/.test(text) && !parts[0].includes('TEST')) parts.push('DUE TO TEST');

      if (/軍機除外/.test(text)) parts.push(', EXC MIL ACFT');
      else if (/民航機除外/.test(text)) parts.push(', EXC CIV ACFT');

      if (/航機可能延誤|班機延誤/.test(text)) parts.push('. TFC MAY BE DELAYED');
      if (/另行通知/.test(text)) parts.push(' UFN');
      if (/永久/.test(text)) parts.push(' PERM');

      const formatted = `E) ${parts.join(' ').replace(/\s+,/g, ',').replace(/\s+\./g, '.')}.`;
      return {
        title: '英文飛航公告內容 (Item E)',
        output: formatted
      };
    }

    function translateNotamContentToCn(raw) {
      let bodyText = raw.trim();
      const eMatch = bodyText.match(/E\)\s*([\s\S]+?)(?=\n[FG]\)|\s+[FG]\)|$)/i);
      if (eMatch) {
        bodyText = eMatch[1].trim();
      } else {
        bodyText = bodyText.replace(/^E\)\s*/i, '');
      }

      let zh = ' ' + bodyText.toUpperCase() + ' ';

      // Layer 1: Multi-word NOTAM phrase rules (longest first)
      const phraseRules = [
        [/RESUMED NML OPS/g, '恢復正常運作'],
        [/WILL TAKE PLACE/g, '將實施'],
        [/DUE TO WIP/g, '因施工中'],
        [/DUE TO MAINT/g, '因維護作業'],
        [/DUE TO CONSTR/g, '因工程施工'],
        [/DUE TO CONST/g, '因工程施工'],
        [/DUE TO TEST/g, '因測試作業'],
        [/DUE TO/g, '因'],
        [/EXC MIL ACFT/g, '軍機除外'],
        [/EXC CIV ACFT/g, '民航機除外'],
        [/TFC MAY BE DELAYED/g, '航機可能延誤'],
        [/TFC WILL BE SUSPENDED/g, '空中交通將暫停'],
        [/DO NOT USE/g, '請勿使用'],
        [/ON TEST/g, '測試中'],
        [/NOT AVBL/g, '不可用'],
        [/NOT LGTD/g, '無燈光標示'],
        [/NOT MARKED/g, '無標示'],
        [/NOT STD/g, '非標準'],
        [/FLAGGED AND LGTD/g, '已插旗並設燈光標示'],
        [/LGTD AND BARRICADED/g, '已設燈光及圍籬'],
        [/IRREGULAR SFC/g, '道面不平整'],
        [/NONMOVEMENT AREA/g, '非活動區'],
        [/MOVEMENT AREA/g, '活動區'],
        [/MANEUVERING AREA/g, '操作區'],
        [/DISPLACED THR/g, '內移跑道頭'],
        [/STANDING WATER/g, '積水'],
        [/RUBBER DEPOSIT/g, '胎膠沉積'],
        [/EDGE LGT/g, '邊燈'],
        [/RUNUP PAD/g, '試車坪'],
        [/SN REMOVAL/g, '除雪作業'],
        [/FLT CHECK/g, '飛測'],
        [/FLIGHT CHECK/g, '飛測'],
        [/GUN FRNG/g, '火砲射擊'],
        [/AIR EXER/g, '空中演習'],
        [/MODEL ROCKET/g, '模型火箭'],
        [/CENTERED AT/g, '中心位於'],
        [/CHANGED TO/g, '變更為'],
        [/REPLACED BY/g, '由以下取代'],
        [/BA GOOD/g, '煞車效應良好'],
        [/BA MEDIUM/g, '煞車效應中等'],
        [/BA POOR/g, '煞車效應不良'],
        [/BA NIL/g, '煞車效應極差'],
        [/BTN\s+([A-Z0-9/-]+)\s+AND\s+([A-Z0-9/-]+)/g, '介於 $1 與 $2 之間'],
        [/WI\s+(\d+(?:\.\d+)?)\s*NM\s+RAD\s+OF/g, '於 $1 浬半徑範圍內（中心點：']
      ];
      phraseRules.forEach(([re, rep]) => { zh = zh.replace(re, rep); });

      // Layer 2: Pattern-aware units, coordinates & runway/taxiway numbers
      zh = zh.replace(/(\d{4,6}(?:\.\d+)?[NS])\s*(\d{5,7}(?:\.\d+)?[EW])/g, '座標 $1 $2');
      zh = zh.replace(/\bFL\s*(\d{2,3})\b/g, '飛航空層$1');
      zh = zh.replace(/(\d+(?:\.\d+)?)\s*FT\b/g, '$1呎');
      zh = zh.replace(/(\d+(?:\.\d+)?)\s*NM\b/g, '$1浬');
      zh = zh.replace(/(\d+(?:\.\d+)?)\s*KM\b/g, '$1公里');
      zh = zh.replace(/(\d+(?:\.\d+)?)\s*M\b/g, '$1公尺');
      zh = zh.replace(/(\d+(?:\.\d+)?)\s*MHZ\b/g, '$1 MHz');
      zh = zh.replace(/(\d+(?:\.\d+)?)\s*KHZ\b/g, '$1 kHz');
      zh = zh.replace(/(\d+)\s*HR\b/g, '$1小時');
      zh = zh.replace(/(\d+)\s*MIN\b/g, '$1分鐘');
      zh = zh.replace(/\bRWY\s+(\d{2}[LRC]?(?:\/\d{2}[LRC]?)?)\b/g, '$1跑道');
      zh = zh.replace(/\bTWY\s+([A-Z0-9]+(?:-[A-Z0-9]+)?)\b/g, '$1滑行道');

      // Layer 3: Full dictionary lookup (sorted longest key first)
      const combinedMap = {};
      NOTAM_DICT.forEach(item => { combinedMap[item.en.toUpperCase()] = item.zh; });
      Object.entries(EXTRA_EN_TO_ZH).forEach(([k, v]) => { combinedMap[k.toUpperCase()] = v; });

      const sortedKeys = Object.keys(combinedMap).sort((a, b) => b.length - a.length);
      for (const key of sortedKeys) {
        const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(`(?<![A-Z0-9/])${escaped}(?![A-Z0-9/])`, 'g');
        zh = zh.replace(re, combinedMap[key]);
      }

      // Clean up spacing & punctuation
      zh = zh.replace(/\s+/g, ' ').replace(/\s+([,.)）])/g, '$1').replace(/([（(])\s+/g, '$1').trim();
      if (zh.includes('（中心點：') && !zh.includes('）')) {
        zh += '）';
      }

      return {
        title: '繁體中文內容翻譯',
        output: zh
      };
    }

    function runTranslation() {
      const raw = notamInput.value.trim();
      if (!raw) {
        showToast('請先輸入要翻譯的內容');
        notamInput.focus();
        return;
      }
      const dir = detectDirection(raw);
      const res = dir === 'cn2en' ? translateCnToNotamContent(raw) : translateNotamContentToCn(raw);
      outputTitle.textContent = res.title;
      outputText.textContent = res.output;
      outputCard.classList.remove('hidden');
      lucide.createIcons();
    }

    // =========================================================================
    // 5. Event Listeners
    // =========================================================================
    notamInput.addEventListener('input', () => {
      updateDirectionBadge();
      updateAutocomplete();
    });

    notamInput.addEventListener('click', updateAutocomplete);
    notamInput.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
        updateAutocomplete();
      }
    });

    notamInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        runTranslation();
      } else if (e.key === 'Tab' && currentSuggestions.length > 0) {
        e.preventDefault();
        insertCompletion(currentSuggestions[0].en);
      }
    });

    toggleDirBtn.addEventListener('click', () => {
      const cur = detectDirection(notamInput.value);
      manualDirection = cur === 'cn2en' ? 'en2cn' : 'cn2en';
      updateDirectionBadge();
      showToast(manualDirection === 'cn2en' ? '已切換：中文 → 英文內容' : '已切換：英文內容 → 繁體中文');
    });

    autocompleteList.addEventListener('click', (e) => {
      const btn = e.target.closest('.ac-chip');
      if (!btn) return;
      insertCompletion(btn.dataset.complete);
    });

    document.querySelectorAll('.sample-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        manualDirection = null;
        notamInput.value = SAMPLES[btn.dataset.sample];
        updateDirectionBadge();
        updateAutocomplete();
        runTranslation();
      });
    });

    translateBtn.addEventListener('click', runTranslation);

    clearBtn.addEventListener('click', () => {
      manualDirection = null;
      notamInput.value = '';
      outputCard.classList.add('hidden');
      autocompleteBar.classList.add('hidden');
      idleHint.classList.remove('hidden');
      updateDirectionBadge();
      notamInput.focus();
    });

    copyBtn.addEventListener('click', async () => {
      const txt = outputText.textContent;
      if (!txt) return;
      try {
        await navigator.clipboard.writeText(txt);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = txt;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      copyBtnText.textContent = '已複製';
      showToast('已複製翻譯結果');
      setTimeout(() => { copyBtnText.textContent = '複製'; }, 1500);
    });

    updateDirectionBadge();
    lucide.createIcons();
  </script>
</body>
</html>
